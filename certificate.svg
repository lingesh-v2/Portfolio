<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b172a" />
      <stop offset="50%" stop-color="#0f223d" />
      <stop offset="100%" stop-color="#050a14" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="cyanBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="420" fill="url(#certBg)" rx="16"/>

  <!-- Ornate Border -->
  <rect x="20" y="20" width="560" height="380" rx="10" fill="none" stroke="url(#gold)" stroke-width="2"/>
  <rect x="28" y="28" width="544" height="364" rx="6" fill="none" stroke="rgba(56,189,248,0.3)" stroke-width="1" stroke-dasharray="8 6"/>

  <!-- Corner Flourishes -->
  <path d="M 32,55 L 55,32 M 32,65 L 65,32 M 568,55 L 545,32 M 568,65 L 535,32" stroke="url(#gold)" stroke-width="1.5"/>
  <path d="M 32,365 L 55,388 M 32,355 L 65,388 M 568,365 L 545,388 M 568,355 L 535,388" stroke="url(#gold)" stroke-width="1.5"/>

  <!-- Header Emblem -->
  <circle cx="300" cy="75" r="26" fill="rgba(234,179,8,0.1)" stroke="url(#gold)" stroke-width="1.5"/>
  <text x="300" y="82" fill="url(#gold)" font-family="'Inter', sans-serif" font-size="20" text-anchor="middle">🎓</text>

  <!-- Certificate Titles -->
  <text x="300" y="125" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="20" font-weight="800" letter-spacing="3" text-anchor="middle">CERTIFICATE OF PARTICIPATION</text>
  <text x="300" y="148" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="12" font-weight="600" letter-spacing="2" text-anchor="middle">NAAN MUDHALVAN SCHEME</text>
  <text x="300" y="170" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" letter-spacing="1" text-anchor="middle">GOVERNMENT OF TAMIL NADU • HIGHER EDUCATION INITIATIVE</text>

  <!-- Divider -->
  <line x1="160" y1="188" x2="440" y2="188" stroke="url(#gold)" stroke-width="1.5"/>
  <circle cx="300" cy="188" r="4" fill="url(#gold)"/>

  <!-- Recipient -->
  <text x="300" y="215" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">This is proudly presented to</text>
  <text x="300" y="250" fill="#ffffff" font-family="'Inter', sans-serif" font-size="24" font-weight="800" text-anchor="middle">LINGESHWARAN</text>

  <text x="300" y="280" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">For active participation and successful completion of technical skill development,</text>
  <text x="300" y="298" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">emerging technologies &amp; academic practical training program.</text>

  <!-- Seal and Signatures -->
  <!-- Left: Authorized Sign -->
  <line x1="70" y1="355" x2="190" y2="355" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <text x="130" y="372" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Program Coordinator</text>

  <!-- Center: Gold Seal -->
  <circle cx="300" cy="345" r="28" fill="url(#gold)"/>
  <circle cx="300" cy="345" r="24" fill="none" stroke="#78350f" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="300" y="343" fill="#78350f" font-family="'Inter', sans-serif" font-size="8" font-weight="800" text-anchor="middle">OFFICIAL</text>
  <text x="300" y="354" fill="#78350f" font-family="'Inter', sans-serif" font-size="7" font-weight="700" text-anchor="middle">VERIFIED</text>

  <!-- Right: Date & Verification -->
  <line x1="410" y1="355" x2="530" y2="355" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <text x="470" y="372" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Academic Council</text>
</svg>
