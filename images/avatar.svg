<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d49b6a" />
      <stop offset="100%" stop-color="#b87b47" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2230" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182238" />
      <stop offset="100%" stop-color="#0d1526" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="460" fill="url(#bgGrad)" rx="24"/>

  <!-- Cyber Grid Lines -->
  <path d="M 40,0 L 40,460 M 120,0 L 120,460 M 200,0 L 200,460 M 280,0 L 280,460 M 360,0 L 360,460" stroke="rgba(56,189,248,0.05)" stroke-width="1"/>
  <path d="M 0,80 L 400,80 M 0,160 L 400,160 M 0,240 L 400,240 M 0,320 L 400,320 M 0,400 L 400,400" stroke="rgba(56,189,248,0.05)" stroke-width="1"/>

  <!-- Glow Halo -->
  <circle cx="200" cy="180" r="115" fill="none" stroke="url(#cyanPurple)" stroke-width="3" filter="url(#neonGlow)" opacity="0.6"/>
  <circle cx="200" cy="180" r="125" fill="none" stroke="url(#cyanPurple)" stroke-width="1" stroke-dasharray="6 8" opacity="0.4"/>

  <!-- Body / Hoodie -->
  <path d="M 90,460 C 90,370 120,325 155,305 L 180,355 L 200,365 L 220,355 L 245,305 C 280,325 310,370 310,460 Z" fill="url(#hoodieGrad)"/>
  <path d="M 155,305 L 200,365 L 245,305" fill="none" stroke="url(#cyanPurple)" stroke-width="2"/>
  <circle cx="180" cy="380" r="3" fill="#38bdf8"/>
  <circle cx="220" cy="380" r="3" fill="#a855f7"/>

  <!-- Neck -->
  <rect x="180" y="240" width="40" height="60" rx="8" fill="url(#skinGrad)"/>

  <!-- Face -->
  <ellipse cx="200" cy="205" rx="55" ry="68" fill="url(#skinGrad)"/>

  <!-- Ears -->
  <ellipse cx="145" cy="205" rx="9" ry="16" fill="url(#skinGrad)"/>
  <ellipse cx="255" cy="205" rx="9" ry="16" fill="url(#skinGrad)"/>

  <!-- Hair -->
  <path d="M 145,195 C 140,135 160,115 200,115 C 240,115 260,135 255,195 C 250,165 240,140 200,140 C 160,140 150,165 145,195 Z" fill="url(#hairGrad)"/>
  <path d="M 150,165 C 160,120 220,110 250,145 C 240,135 210,130 190,140 C 170,150 155,155 150,165 Z" fill="#2d3748"/>

  <!-- Eyebrows -->
  <path d="M 165,182 Q 180,175 190,182" fill="none" stroke="#1a202c" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 210,182 Q 220,175 235,182" fill="none" stroke="#1a202c" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Glasses -->
  <rect x="160" y="188" width="34" height="26" rx="7" fill="rgba(56,189,248,0.1)" stroke="#38bdf8" stroke-width="2.5"/>
  <rect x="206" y="188" width="34" height="26" rx="7" fill="rgba(56,189,248,0.1)" stroke="#38bdf8" stroke-width="2.5"/>
  <path d="M 194,198 L 206,198" stroke="#38bdf8" stroke-width="2.5"/>
  <path d="M 148,198 L 160,198 M 240,198 L 252,198" stroke="#38bdf8" stroke-width="2"/>

  <!-- Eyes behind glasses -->
  <ellipse cx="177" cy="201" rx="4" ry="5" fill="#111827"/>
  <ellipse cx="223" cy="201" rx="4" ry="5" fill="#111827"/>
  <circle cx="178" cy="199" r="1.5" fill="#ffffff"/>
  <circle cx="224" cy="199" r="1.5" fill="#ffffff"/>

  <!-- Nose -->
  <path d="M 200,205 Q 202,217 197,222 L 203,222" fill="none" stroke="#92592d" stroke-width="2" stroke-linecap="round"/>

  <!-- Friendly Smile & Stubble -->
  <path d="M 188,238 Q 200,248 212,238" fill="none" stroke="#85481d" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 175,228 Q 200,265 225,228" fill="none" stroke="rgba(45,55,72,0.3)" stroke-width="3" stroke-dasharray="1 3"/>

  <!-- Code Elements / Badges -->
  <g transform="translate(45, 80)">
    <rect width="80" height="28" rx="14" fill="#0f172a" stroke="rgba(56,189,248,0.4)" stroke-width="1"/>
    <text x="40" y="18" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">&lt;code/&gt;</text>
  </g>

  <g transform="translate(280, 80)">
    <rect width="75" height="28" rx="14" fill="#0f172a" stroke="rgba(168,85,247,0.4)" stroke-width="1"/>
    <text x="37.5" y="18" fill="#c084fc" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">AI • DEV</text>
  </g>

  <!-- Laptop silhouette at bottom -->
  <g transform="translate(130, 410)">
    <rect x="0" y="0" width="140" height="8" rx="3" fill="#334155"/>
    <path d="M -15,8 L 155,8 L 165,16 L -25,16 Z" fill="#1e293b" stroke="rgba(56,189,248,0.4)" stroke-width="1"/>
    <rect x="60" y="10" width="20" height="3" rx="1.5" fill="#38bdf8"/>
  </g>
</svg>
