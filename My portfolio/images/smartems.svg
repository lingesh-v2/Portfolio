<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="seBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="seAcc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="360" fill="url(#seBg)" rx="16"/>

  <!-- Browser Frame -->
  <rect x="25" y="25" width="550" height="310" rx="12" fill="#0f172a" stroke="rgba(56,189,248,0.25)" stroke-width="1.5"/>
  <rect x="25" y="25" width="550" height="38" rx="12" fill="#1e293b"/>
  <circle cx="45" cy="44" r="5" fill="#ef4444"/>
  <circle cx="62" cy="44" r="5" fill="#eab308"/>
  <circle cx="79" cy="44" r="5" fill="#22c55e"/>
  
  <rect x="110" y="34" width="280" height="20" rx="6" fill="#0f172a" stroke="rgba(255,255,255,0.08)"/>
  <text x="125" y="48" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">smartems.local/dashboard</text>

  <!-- Dashboard Sidebar -->
  <rect x="35" y="73" width="110" height="252" fill="#0b1120" rx="6"/>
  <rect x="45" y="85" width="90" height="18" rx="4" fill="rgba(56,189,248,0.15)"/>
  <text x="52" y="98" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="10" font-weight="700">⚡ Overview</text>
  <rect x="45" y="112" width="90" height="14" rx="4" fill="rgba(255,255,255,0.03)"/>
  <text x="52" y="123" fill="#64748b" font-family="'Inter', sans-serif" font-size="9">👥 Employees</text>
  <rect x="45" y="134" width="90" height="14" rx="4" fill="rgba(255,255,255,0.03)"/>
  <text x="52" y="145" fill="#64748b" font-family="'Inter', sans-serif" font-size="9">📊 Analytics</text>
  <rect x="45" y="156" width="90" height="14" rx="4" fill="rgba(255,255,255,0.03)"/>
  <text x="52" y="167" fill="#64748b" font-family="'Inter', sans-serif" font-size="9">⚙️ Settings</text>

  <!-- Main Content Area -->
  <!-- Top KPI Cards -->
  <g transform="translate(155, 75)">
    <!-- KPI 1 -->
    <rect x="0" y="0" width="125" height="60" rx="8" fill="#1e293b" stroke="rgba(56,189,248,0.15)"/>
    <text x="12" y="20" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Total Staff</text>
    <text x="12" y="44" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="18" font-weight="700">1,248</text>
    <text x="75" y="44" fill="#34d399" font-family="'Inter', sans-serif" font-size="10">+12%</text>

    <!-- KPI 2 -->
    <rect x="135" y="0" width="125" height="60" rx="8" fill="#1e293b" stroke="rgba(168,85,247,0.15)"/>
    <text x="147" y="20" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Active Shifts</text>
    <text x="147" y="44" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="18" font-weight="700">94.2%</text>
    <text x="210" y="44" fill="#a78bfa" font-family="'Inter', sans-serif" font-size="10">Live</text>

    <!-- KPI 3 -->
    <rect x="270" y="0" width="135" height="60" rx="8" fill="#1e293b" stroke="rgba(56,189,248,0.15)"/>
    <text x="282" y="20" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Departments</text>
    <text x="282" y="44" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="18" font-weight="700">8 Units</text>
  </g>

  <!-- Chart / Analytics Area -->
  <g transform="translate(155, 145)">
    <rect x="0" y="0" width="255" height="175" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.06)"/>
    <text x="14" y="22" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Workforce Growth</text>

    <!-- Bars -->
    <rect x="25" y="110" width="18" height="45" rx="3" fill="url(#barGrad)"/>
    <rect x="55" y="85" width="18" height="70" rx="3" fill="url(#barGrad)"/>
    <rect x="85" y="70" width="18" height="85" rx="3" fill="url(#barGrad)"/>
    <rect x="115" y="95" width="18" height="60" rx="3" fill="url(#barGrad)"/>
    <rect x="145" y="55" width="18" height="100" rx="3" fill="url(#barGrad)"/>
    <rect x="175" y="40" width="18" height="115" rx="3" fill="url(#barGrad)"/>
    <rect x="205" y="30" width="18" height="125" rx="3" fill="#38bdf8"/>

    <line x1="15" y1="158" x2="240" y2="158" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  </g>

  <!-- Recent Table preview -->
  <g transform="translate(420, 145)">
    <rect x="0" y="0" width="140" height="175" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.06)"/>
    <text x="12" y="22" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Recent Logs</text>
    
    <circle cx="22" cy="50" r="10" fill="#38bdf8"/>
    <rect x="40" y="44" width="60" height="6" rx="2" fill="#94a3b8"/>
    <rect x="40" y="54" width="40" height="5" rx="2" fill="#475569"/>

    <circle cx="22" cy="85" r="10" fill="#a855f7"/>
    <rect x="40" y="79" width="70" height="6" rx="2" fill="#94a3b8"/>
    <rect x="40" y="89" width="45" height="5" rx="2" fill="#475569"/>

    <circle cx="22" cy="120" r="10" fill="#34d399"/>
    <rect x="40" y="114" width="65" height="6" rx="2" fill="#94a3b8"/>
    <rect x="40" y="124" width="50" height="5" rx="2" fill="#475569"/>
  </g>
</svg>
