<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="emBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c192c" />
      <stop offset="100%" stop-color="#020814" />
    </linearGradient>
    <linearGradient id="emBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="url(#emBg)" rx="16"/>

  <!-- Browser Frame -->
  <rect x="25" y="25" width="550" height="310" rx="12" fill="#0f1e36" stroke="rgba(56,189,248,0.2)" stroke-width="1.5"/>
  <rect x="25" y="25" width="550" height="38" rx="12" fill="#172b4d"/>
  <circle cx="45" cy="44" r="5" fill="#ef4444"/>
  <circle cx="62" cy="44" r="5" fill="#eab308"/>
  <circle cx="79" cy="44" r="5" fill="#22c55e"/>

  <rect x="110" y="34" width="280" height="20" rx="6" fill="#0f1e36" stroke="rgba(255,255,255,0.08)"/>
  <text x="125" y="48" fill="#93c5fd" font-family="'Inter', sans-serif" font-size="10">ems-portal.local/directory</text>

  <!-- Search & Action Bar -->
  <g transform="translate(45, 75)">
    <rect x="0" y="0" width="320" height="34" rx="8" fill="#13233f" stroke="rgba(255,255,255,0.08)"/>
    <text x="15" y="22" fill="#64748b" font-family="'Inter', sans-serif" font-size="11">🔍 Search employee by name, ID or role...</text>

    <rect x="335" y="0" width="85" height="34" rx="8" fill="#13233f" stroke="rgba(255,255,255,0.08)"/>
    <text x="377" y="22" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Filters ▾</text>

    <rect x="430" y="0" width="80" height="34" rx="8" fill="url(#emBar)"/>
    <text x="470" y="22" fill="#ffffff" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">+ Add New</text>
  </g>

  <!-- Table Header -->
  <g transform="translate(45, 122)">
    <rect x="0" y="0" width="510" height="28" rx="6" fill="#192d4f"/>
    <text x="15" y="18" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" font-weight="700">EMPLOYEE</text>
    <text x="180" y="18" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" font-weight="700">DEPARTMENT</text>
    <text x="310" y="18" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" font-weight="700">STATUS</text>
    <text x="440" y="18" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" font-weight="700">ACTIONS</text>
  </g>

  <!-- Row 1 -->
  <g transform="translate(45, 158)">
    <rect x="0" y="0" width="510" height="46" rx="6" fill="#12213d"/>
    <circle cx="25" cy="23" r="13" fill="#38bdf8"/>
    <text x="25" y="27" fill="#030712" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">LW</text>
    <text x="48" y="20" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Lingeshwaran</text>
    <text x="48" y="34" fill="#64748b" font-family="'Inter', sans-serif" font-size="9">emp_001@tech.corp</text>
    <text x="180" y="27" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">Engineering (AI/Web)</text>
    <rect x="310" y="13" width="55" height="20" rx="10" fill="rgba(34,197,94,0.15)"/>
    <text x="337" y="26" fill="#4ade80" font-family="'Inter', sans-serif" font-size="9" font-weight="600" text-anchor="middle">Active</text>
    <text x="455" y="27" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="11">✏️ 🗑️</text>
  </g>

