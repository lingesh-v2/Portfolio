  <g transform="translate(45, 212)">
    <rect x="0" y="0" width="510" height="46" rx="6" fill="#12213d"/>
    <circle cx="25" cy="23" r="13" fill="#a855f7"/>
    <text x="25" y="27" fill="#ffffff" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">AR</text>
    <text x="48" y="20" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Arun Kumar</text>
    <text x="48" y="34" fill="#64748b" font-family="'Inter', sans-serif" font-size="9">arun.k@tech.corp</text>
    <text x="180" y="27" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">Database Admin</text>
    <rect x="310" y="13" width="55" height="20" rx="10" fill="rgba(34,197,94,0.15)"/>
    <text x="337" y="26" fill="#4ade80" font-family="'Inter', sans-serif" font-size="9" font-weight="600" text-anchor="middle">Active</text>
    <text x="455" y="27" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="11">✏️ 🗑️</text>
  </g>

  <!-- Row 3 -->
  <g transform="translate(45, 266)">
    <rect x="0" y="0" width="510" height="46" rx="6" fill="#12213d"/>
    <circle cx="25" cy="23" r="13" fill="#f59e0b"/>
    <text x="25" y="27" fill="#030712" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">SK</text>
    <text x="48" y="20" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Sanjay Kumar</text>
    <text x="48" y="34" fill="#64748b" font-family="'Inter', sans-serif" font-size="9">sanjay.k@tech.corp</text>
    <text x="180" y="27" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">Quality Analyst</text>
    <rect x="310" y="13" width="55" height="20" rx="10" fill="rgba(245,158,11,0.15)"/>
    <text x="337" y="26" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="9" font-weight="600" text-anchor="middle">On Leave</text>
    <text x="455" y="27" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="11">✏️ 🗑️</text>
  </g>
